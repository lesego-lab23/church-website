<section class="services-section">

<h1>Our Services</h1>

<div class="services-grid">

<article class="service-card" *ngFor="let service of services">

<div class="service-header">
<h3>{{ service.title }}</h3>
<span class="service-corner-icon" aria-hidden="true"></span>
</div>

<span class="service-badge">{{ service.badge }}</span>

<p class="service-description">
{{ service.description }}
</p>

<div class="service-divider"></div>

<div class="service-meta">
<p>
<lucide-icon name="calendar-days" size="16"></lucide-icon>
<span>{{ service.day }}</span>
</p>

<p>
<lucide-icon name="clock" size="16"></lucide-icon>
<span>{{ service.time }}</span>
</p>

<p>
<lucide-icon name="map-pin" size="16"></lucide-icon>
<span>{{ service.location }}</span>
</p>
</div>

</article>

</div>

</section>
