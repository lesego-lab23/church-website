<header class="navbar" [class.is-scrolled]="isScrolled">
  <div class="shell navbar-inner">

    <a class="brand" routerLink="/home" (click)="closeMenu()">
      <span class="brand-mark" role="img" aria-label="The Potter's House logo"></span>
      <span class="brand-name">
        <span class="brand-name-top">The Potter's House</span>
        <span class="brand-name-bottom">Melville Church</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-nav"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
    >
      <lucide-icon [name]="isMenuOpen ? 'x' : 'menu'" size="24"></lucide-icon>
    </button>

    <nav id="primary-nav" class="nav" [class.is-open]="isMenuOpen" aria-label="Primary">
      <ul class="nav-links">
        <li *ngFor="let item of navItems">
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >{{ item.label }}</a>
        </li>
      </ul>

      <span class="nav-divider" aria-hidden="true"></span>

      <a class="btn btn-primary nav-cta" routerLink="/services" (click)="closeMenu()">Plan a visit</a>
    </nav>

  </div>
</header>
